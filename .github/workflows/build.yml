
name: Build Custom Powers SMP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn --batch-mode clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomPowersSMP-Plugin
          path: target/custompowerssmp-1.0.0.jar

      - name: Package resource pack
        run: |
          cd resource-pack
          zip -r ../CustomPowersSMP-ResourcePack.zip .

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: CustomPowersSMP-ResourcePack
          path: CustomPowersSMP-ResourcePack.zip
